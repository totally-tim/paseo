name: iOS TestFlight

# Fork-only. Builds the iOS app and uploads it to TestFlight, matching how
# desktop-release.yml is triggered so both platforms share one release habit.
# The version comes from the tag: the fork never commits a version bump, and
# native-release-version.js derives a unique iOS build number per version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.1.0-beta.1)"
        required: true
        type: string
      checkout_ref:
        description: "Optional branch/ref to check out while using tag for version metadata."
        required: false
        default: ""
        type: string
      upload:
        description: "Upload the build to TestFlight."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.event.inputs.tag) || github.ref_name }}
  SHOULD_UPLOAD: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload != 'false' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The fork never commits a version bump, so the tag is the only source of
      # the app version and the derived iOS build number. docs/fork.md.
      - name: Stamp workspace versions from tag
        shell: bash
        run: node scripts/fork/stamp-version.mjs "$RELEASE_VERSION"

      # Same preparation EAS runs via the eas-build-post-install hook.
      - name: Build app dependencies
        run: |
          npm run build:app-deps
          npm run build:terminal-webview --workspace=@getpaseo/app

      - name: Generate the native iOS project
        working-directory: packages/app
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform ios --no-install --clean

      # expo-notifications writes aps-environment=development. An App Store
      # profile only grants production, and codesign rejects the mismatch.
      - name: Promote the push entitlement for a distribution build
        working-directory: packages/app/ios
        run: |
          set -euo pipefail
          ENTITLEMENTS="$(ls ./*/*.entitlements | head -1)"
          plutil -replace aps-environment -string production "$ENTITLEMENTS"
          echo "$ENTITLEMENTS now reads:"
          plutil -p "$ENTITLEMENTS"

      - name: Install CocoaPods
        working-directory: packages/app/ios
        run: pod install --repo-update

      - name: Import signing certificate
        env:
          IOS_DIST_CERTIFICATE: ${{ secrets.IOS_DIST_CERTIFICATE }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          # Without this, codesign blocks on a GUI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -o - -)"
          NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract Name raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile $NAME ($UUID)"

      - name: Resolve the Xcode scheme
        id: scheme
        working-directory: packages/app/ios
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).workspace.schemes.find(x=>!/Pods|Tests/.test(x))))')"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building workspace $WORKSPACE, scheme $SCHEME"

      - name: Archive
        working-directory: packages/app/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          XC_WORKSPACE: ${{ steps.scheme.outputs.workspace }}
          XC_SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$XC_WORKSPACE" \
            -scheme "$XC_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Paseo.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }

      - name: Export the IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.svpg.paseo</key><string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Paseo.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: env.SHOULD_UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool only looks for the key in these fixed locations.
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA="$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Upload the IPA as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14
